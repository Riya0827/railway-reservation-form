<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Railway Reservation Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Railway Reservation Form</h1>
    <form action="">
      <div>
        <label for="Passenger Name">Passenger Name:</label>
        <input
          type="text"
          id="Passenger Name"
          name="Passenger Name"
          placeholder="Enter Passenger Name"
        />
      </div>

      <div>
        <label for="Email">Email:</label>
        <input type="email" id="Email" name="Email" placeholder="Enter Email" />
      </div>

      <div>
        <label for="Password">Password:</label>
        <input
          type="password"
          id="Password"
          name="Password"
          placeholder="Enter Password"
        />
      </div>

      <div>
        <label for="Phone Number">Phone Number:</label>
        <input
          type="tel"
          id="Phone Number"
          name="Phone Number"
          placeholder="Enter Phone Number"
        />
      </div>

      <div>
        <label for="Age">Age:</label>
        <input type="number" id="Age" name="Age" placeholder="Enter Age" />
      </div>

      <div>
        <label for="Gender">Gender:</label>
        <div class="radio-group">
          <input type="radio" id="male" name="Gender" value="male" />
          <label for="male">Male</label>
          <input type="radio" id="female" name="Gender" value="female" />
          <label for="female">Female</label>
          <input type="radio" id="other" name="Gender" value="other" />
          <label for="other">Other</label>
        </div>
      </div>

      <div>
        <label for="Facilities Required">Facilities Required:</label>
        <div class="checkbox-group">
          <input
            type="checkbox"
            id="wifi"
            name="Facilities Required"
            value="wifi"
          />
          <label for="wifi">WiFi</label>
          <input
            type="checkbox"
            id="food"
            name="Facilities Required"
            value="food"
          />
          <label for="food">Food</label>
          <input
            type="checkbox"
            id="restroom"
            name="Facilities Required"
            value="restroom"
          />
          <label for="restroom">Restroom</label>
          <input
            type="checkbox"
            id="Blanket"
            name="Facilities Required"
            value="Blanket"
          />
          <label for="Blanket">Blanket</label>
          <input
            type="checkbox"
            id="wheelchair"
            name="Facilities Required"
            value="wheelchair"
          />
          <label for="wheelchair">Wheelchair</label>
        </div>
      </div>

      <div>
        <label for="From">From:</label>
        <input
          type="text"
          id="From"
          name="From"
          placeholder="Enter Departure Station"
        />
      </div>

      <div>
        <label for="To">To:</label>
        <input
          type="text"
          id="To"
          name="To"
          placeholder="Enter Arrival Station"
        />
      </div>

      <div>
        <label for="Journey Date">Journey Date:</label>
        <input type="date" id="Journey Date" name="Journey Date" />
      </div>

      <div>
        <label for="Class">Class:</label>
        <select id="Class" name="Class">
          <option value="sleeper">Sleeper</option>
          <option value="AC3Tier">AC 3 Tier</option>
          <option value="AC2Tier">AC 2 Tier</option>
          <option value="First Class">First Class</option>
          <option value="general">General</option>
        </select>
      </div>

      <div>
        <label for="Upload ID Proof">Upload ID Proof:</label>
        <input type="file" id="Upload ID Proof" name="Upload ID Proof" />
      </div>

      <div>
        <label for="Address">Address:</label>
        <input
          type="text"
          id="Address"
          name="Address"
          placeholder="Enter Address"
        />
      </div>

      <div>
        <label for="Special Request">Special Request:</label>
        <input
          type="text"
          id="Special Request"
          name="Special Request"
          placeholder="Enter Special Request"
        />
      </div>

      <div class="buttons">
        <button type="submit" id="submit">Submit</button>
        <button type="reset" id="reset">Reset</button>
      </div>
    </form>
  </body>
</html>
